<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="robots" content="noindex,nofollow">
  <title>Digital Den Client Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/authenticated-overrides.css">
</head>
<body>
  <div id="app" class="app-shell" data-environment="production">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#overview" aria-label="Digital Den workspace home">
        <span class="brand-mark" aria-hidden="true">DD</span>
        <span><strong>Digital Den</strong><small>Client workspace</small></span>
      </a>
      <div class="preview-banner" role="status">
        <strong>Secure workspace</strong>
        <span>Your project information is scoped to your verified account.</span>
      </div>
      <nav id="primary-nav" class="nav-list"></nav>
      <div class="sidebar-footer">
        <div class="identity-card">
          <span id="actor-avatar" class="avatar">DD</span>
          <span><strong id="actor-name">Client</strong><small id="actor-role">Authenticated workspace</small></span>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button id="mobile-menu-button" class="icon-button mobile-only" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
        <a class="mobile-brand mobile-only" href="#overview" aria-label="Digital Den workspace home">
          <span class="mobile-brand-mark" aria-hidden="true">DD</span>
          <span class="mobile-brand-name">Digital Den</span>
        </a>
        <label class="search-box">
          <span class="sr-only">Search projects</span>
          <input id="global-search" type="search" placeholder="Search your projects…" autocomplete="off">
        </label>
        <div class="topbar-actions">
          <span id="environment-pill" class="pill neutral">Client Workspace</span>
          <button class="button secondary" type="button" disabled title="Notifications will be connected in a later phase">Notifications</button>
          <button class="button primary" type="button" disabled title="New project requests are submitted through the Digital Den project brief">New project</button>
        </div>
      </header>

      <section class="workspace-heading">
        <div>
          <p class="eyebrow">Digital Den client workspace</p>
          <h1 id="view-title">Overview</h1>
          <p id="view-description">Secure access to your projects, messages, files and billing status.</p>
        </div>
        <div class="role-preview" aria-label="Preview role selector">
          <span>Preview as</span>
          <button type="button" data-role="manager">Manager</button>
          <button type="button" data-role="team_member">Team member</button>
          <button type="button" data-role="client">Client</button>
        </div>
      </section>

      <section id="workspace-content" class="workspace-content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
