<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <meta name="robots" content="noindex,nofollow">
  <title>Digital Den Client Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090d;--panel:#121722;--line:rgba(255,255,255,.11);--text:#f7f5ef;--muted:#a8adb8;--cyan:#51d7ff;--violet:#8f6bff;--red:#ff8d98;--green:#6fd3a5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0,rgba(143,107,255,.15),transparent 26%),radial-gradient(circle at 85% 5%,rgba(81,215,255,.10),transparent 24%),var(--bg);color:var(--text);font:15px/1.6 "DM Sans",sans-serif}.shell{width:min(520px,100%)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--violet),var(--cyan));color:#071017;font:800 13px Manrope}.brand strong{display:block;font:800 16px Manrope}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));padding:26px;box-shadow:0 28px 80px rgba(0,0,0,.36)}h1{margin:0;font:800 32px/1.05 Manrope;letter-spacing:-.04em}p{color:var(--muted)}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);color:var(--text);padding:12px 13px;font:inherit}button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,var(--cyan),#b7f4ff);color:#071017;font-weight:800;cursor:pointer}button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}button:disabled{opacity:.55;cursor:not-allowed}#open-workspace-panel{display:grid;gap:10px;margin:16px 0}.notice{margin-top:14px;border:1px solid var(--line);border-radius:13px;padding:12px 13px;color:var(--muted)}.notice.error{border-color:rgba(255,141,152,.28);color:var(--red);background:rgba(255,141,152,.06)}.notice.success{border-color:rgba(111,211,165,.28);color:var(--green);background:rgba(111,211,165,.06)}.hidden{display:none}.footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}.footer a{color:var(--cyan)}
  </style>
</head>
<body data-api-base="">
  <main class="shell">
    <a class="brand" href="./" aria-label="Digital Den home"><span class="mark">DD</span><span><strong>Digital Den</strong><small>by Quiz & Rise</small></span></a>
    <section class="card">
      <p style="color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px">Secure client access</p>
      <h1>Open your workspace</h1>
      <p id="intro">Enter the email address used for your Digital Den project. We will send a secure one-time access link.</p>

      <div id="open-workspace-panel" hidden>
        <button id="open-workspace-button" type="button">Open workspace</button>
        <button id="sign-out-device-button" type="button" class="secondary">Sign out of this device</button>
      </div>

      <form id="request-form">
        <label for="email">Project email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="320" placeholder="you@example.com">
        <button id="request-button" type="submit">Send secure access link</button>
      </form>

      <div id="status" class="notice hidden" role="status" aria-live="polite"></div>
    </section>
    <p class="footer">Access is limited to authorised Digital Den projects. <a href="./">Return to Digital Den</a></p>
  </main>
  <script type="module" src="./workspace-access.js"></script>
</body>
</html>
